<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Future University Track</title>
<style>
:root{--bg:#070d1a;--card:rgba(255,255,255,.05);--text:#f1f4fb;--muted:#9aa7c2;--gold:#e0b95f;--border:rgba(255,255,255,.12);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(1000px 600px at 50% -10%,#1b2f66,transparent 70%),radial-gradient(700px 500px at 100% 45%,rgba(120,70,200,.18),transparent 70%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.55}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}
#lang{clip-path:circle(150% at 50% 50%);transition:clip-path .9s cubic-bezier(.7,0,.2,1);position:fixed;inset:0;z-index:9;background:radial-gradient(800px 500px at 50% 0,#1d2e57,var(--bg));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#lang.hide{display:none}
#lang h2{font-family:Georgia,serif;margin:10px 0 0;font-size:1.7rem}
#lang p{color:var(--muted);margin:0 0 10px}
.lb{width:min(320px,100%);padding:16px;border-radius:14px;border:1px solid var(--border);background:var(--card);color:var(--text);font:inherit;font-size:1.1rem;font-weight:600;cursor:pointer;transition:.15s}
.lb:hover{border-color:var(--gold);transform:translateY(-2px)}
nav{display:flex;justify-content:flex-end;padding:16px 0}
.sw{display:flex;gap:6px}
.sw button{background:var(--card);border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:6px 11px;font:inherit;font-size:.8rem;cursor:pointer}
.sw button.on{color:#1a1405;background:var(--gold);border-color:var(--gold)}
.hero{text-align:center;padding:10px 0 60px}
.big{width:160px;height:160px;filter:drop-shadow(0 10px 40px rgba(224,185,95,.35))}
.tag{color:var(--gold);font-size:.82rem;letter-spacing:.22em;text-transform:uppercase;margin-top:6px}
.name{font-family:Georgia,serif;font-size:clamp(2.4rem,9vw,4.6rem);line-height:1.05;margin:10px 0 16px;background:linear-gradient(90deg,#fff,#f6df97 60%,#e0b95f);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:var(--muted);max-width:56ch;margin:0 auto 26px}
.btn{display:inline-block;background:linear-gradient(135deg,#f6df97,#c9992f);color:#1a1405;padding:14px 30px;border-radius:999px;text-decoration:none;border:0;font:inherit;font-weight:700;cursor:pointer}
.stats{display:flex;gap:30px;justify-content:center;margin-top:34px;color:var(--muted);font-size:.85rem;flex-wrap:wrap}
.stats b{display:block;color:var(--text);font-size:1.3rem;font-family:Georgia,serif}
section{padding:46px 0}
h2{font-family:Georgia,serif;font-size:1.75rem;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 22px}
.steps{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.glass{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:22px;backdrop-filter:blur(6px)}
.num{font-family:Georgia,serif;font-size:2rem;color:var(--gold)}
.glass h3{margin:4px 0;font-size:1.1rem}.glass p{margin:0;color:var(--muted);font-size:.92rem}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.chip{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px 10px;color:var(--text);font:inherit;font-size:.9rem;cursor:pointer;transition:.15s;text-align:center}
.chip:hover{border-color:var(--gold);translate:0 -3px}
.chip.on{border-color:var(--gold);background:rgba(224,185,95,.14)}
.em{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.07);display:grid;place-items:center;font-size:1.5rem}
#cnt{color:var(--gold);font-weight:700;margin:0 0 14px}
label{display:block;font-size:.85rem;color:var(--muted);margin:16px 0 6px}
select{width:100%;padding:13px;border:1px solid var(--border);border-radius:10px;font:inherit;background:#0f1830;color:var(--text)}
#picked{margin-top:14px;color:var(--gold)}
.glass .btn{margin-top:22px;width:100%;text-align:center}
.msg{margin-top:14px;padding:12px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid var(--border)}
.hide{display:none}
.note{font-size:.82rem;color:var(--muted);margin-top:12px}
footer{border-top:1px solid var(--border);padding:24px 0;color:var(--muted);font-size:.85rem;text-align:center}

.wrap,footer{position:relative;z-index:1}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#glow{position:fixed;left:0;top:0;width:460px;height:460px;margin:-230px 0 0 -230px;background:radial-gradient(circle,rgba(224,185,95,.14),transparent 65%);pointer-events:none;z-index:0;will-change:transform}
#bar{position:fixed;top:env(safe-area-inset-top,0px);left:0;height:3px;width:0;background:linear-gradient(90deg,#4f7cff,#f6df97);z-index:20}
#lang>*{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
#lang.leave{clip-path:circle(0% at 50% 50%);transition-delay:.3s}
#lang.leave img{animation:zoom .8s forwards}
#lang .sp{position:absolute;left:50%;top:36%;width:6px;height:6px;border-radius:50%;background:#f6df97;box-shadow:0 0 12px #e0b95f;animation:burst .9s ease-out forwards}
@keyframes burst{to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
@keyframes zoom{to{transform:scale(2.6);opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.9)}to{opacity:1;transform:none}}
@keyframes float{50%{transform:translateY(-12px)}}
@keyframes swap{0%{opacity:.15;filter:blur(8px)}100%{opacity:1;filter:none}}
.wrap.swap{animation:swap .5s}
.hero>*{opacity:0}
body.ready .hero>*{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.big{display:block;margin:0 auto;animation:float 5s ease-in-out infinite}
.rv{opacity:0;transform:translateY(46px);transition:opacity .9s,transform .9s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
#pick.in .chip{animation:pop .55s backwards}
.chip,.steps .glass{transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));background-image:radial-gradient(140px circle at var(--mx,50%) var(--my,50%),rgba(224,185,95,.2),transparent)}
.btn{position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.6) 50%,transparent 70%);transform:translateX(-130%)}
.btn:hover::after{transform:translateX(130%);transition:transform .7s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv,.hero>*{opacity:1!important;transform:none!important}#bg,#glow{display:none}}
.ends{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.big{width:min(320px,76vw);height:auto;filter:drop-shadow(0 8px 36px rgba(224,185,95,.35))}
#lang img{width:min(260px,62vw,32vh);height:auto;filter:drop-shadow(0 8px 36px rgba(224,185,95,.35))}
.fl{display:inline-block;min-width:36px;padding:2px 6px;margin-right:10px;border-radius:6px;background:rgba(224,185,95,.18);color:var(--gold);font-size:.75rem}
@media (max-width:700px),(pointer:coarse){#lang{transition:none!important}#lang>*{animation:none!important}#lang.leave{clip-path:none!important}.wrap.swap{animation:none!important}.hero>*{opacity:1!important;animation:none!important}.big{animation:none!important}.rv{opacity:1!important;transform:none!important;transition:none!important}#bg,#glow{display:none!important}}
</style>
</head>

var cv=$("bg"),cx=cv.getContext("2d"),W=0,H=0,S=[],mx=-999,my=-999,tl=null,glow=$("glow");
